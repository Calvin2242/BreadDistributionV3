<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PPKI SMK Tansau - Bread</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#0f1629;--bar:#0a0f1e;--card:#172240;--line:#2a3a5e;--ink:#f1f4fb;--mute:#8d9bbd;--gold:#f0b235;--teal:#3cc3ab;--bad:#ff7b6b}
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--bar);padding:12px 16px;display:flex;align-items:center;gap:12px}
header b{flex:1;font-size:1.15rem}
nav{display:flex;background:#121b34;border-bottom:1px solid var(--line)}
nav button{flex:1;background:none;border:0;border-bottom:3px solid transparent;color:var(--mute);font-weight:700;font-size:.9rem;padding:14px 2px;border-radius:0}
nav button.on{color:var(--ink);border-color:var(--gold)}
main{max-width:720px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:14px 0}
h2{font-size:1.1rem;margin:0 0 10px}
label{display:block;font-weight:700;font-size:.9rem;margin:12px 0 6px}
input,select,textarea{width:100%;font:inherit;padding:12px;background:var(--bar);color:var(--ink);border:1px solid var(--line);border-radius:8px}
input[type=number]{width:90px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 14px}
button.go{background:var(--gold);color:#241a00;font-weight:800;border:0;width:100%;padding:16px;font-size:1.1rem}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.tiles{display:flex;gap:10px;flex-wrap:wrap}
.tile{min-width:150px;text-align:left;border:2px solid var(--line);border-radius:12px;padding:14px;flex:1}
.tile.on{border-color:var(--gold)}
.tile small{color:var(--mute);display:block}
.tile em{font:800 2rem/1.1 system-ui;display:block;font-style:normal}
.who{font-size:1.4rem;font-weight:800;padding:22px 12px;min-width:46%}
.names{flex-direction:column;flex-wrap:nowrap}
.names .who{min-width:0;flex:none}
.qty{display:flex;align-items:center;justify-content:space-between}
.qty button{width:56px;height:56px;font-size:1.6rem}
.qty b{font-size:2rem}
.pay{display:flex;gap:10px}.pay button{flex:1;padding:16px;font-weight:700}
.pay button.on{background:var(--teal);color:#06201a;border-color:var(--teal)}
.sum{background:var(--bar);border-radius:10px;text-align:center;padding:16px;margin:14px 0}
.sum b{font-size:1.9rem}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
.r{text-align:right}.mute{color:var(--mute)}.bad{color:var(--bad)}.ok{color:var(--teal);font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.big{font-size:1.7rem;font-weight:800;color:var(--gold)}
.scroll{overflow-x:auto}
textarea{resize:vertical}
.btn{display:inline-block;text-decoration:none;font:inherit;border-radius:8px;padding:10px 14px;background:var(--gold);color:#241a00;font-weight:800}
#cropper{position:fixed;inset:0;background:#000c;z-index:7;display:none;align-items:center;justify-content:center;padding:12px}
#cropper.on{display:flex}
.cw{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;max-width:100%;text-align:center}
.stage{position:relative;overflow:hidden;margin:10px auto;touch-action:none;user-select:none;-webkit-user-select:none;background:#fff}
.stage img{display:block;width:100%;height:100%;pointer-events:none;-webkit-user-drag:none}
#cbox{position:absolute;box-shadow:0 0 0 9999px #000a;outline:2px solid #fff;cursor:move;touch-action:none;background-image:linear-gradient(#fff7 1px,transparent 1px),linear-gradient(90deg,#fff7 1px,transparent 1px);background-size:33.333% 33.333%}
#cbox i{position:absolute;width:38px;height:38px;touch-action:none}
#cbox i::after{content:'';position:absolute;width:16px;height:16px;border:0 solid #fff}
#cbox i.nw{left:0;top:0;cursor:nwse-resize}#cbox i.nw::after{left:3px;top:3px;border-width:4px 0 0 4px}
#cbox i.ne{right:0;top:0;cursor:nesw-resize}#cbox i.ne::after{right:3px;top:3px;border-width:4px 4px 0 0}
#cbox i.sw{left:0;bottom:0;cursor:nesw-resize}#cbox i.sw::after{left:3px;bottom:3px;border-width:0 0 4px 4px}
#cbox i.se{right:0;bottom:0;cursor:nwse-resize}#cbox i.se::after{right:3px;bottom:3px;border-width:0 4px 4px 0}
.sw{display:flex;align-items:center;gap:12px;margin-top:14px;cursor:pointer}
.sw input{position:absolute;opacity:0;width:1px;height:1px;padding:0;border:0}
.sw .tr{width:52px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw .tr::after{content:'';position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.sw input:checked+.tr{background:var(--teal)}
.sw input:checked+.tr::after{transform:translateX(22px)}
.sw input:focus-visible+.tr{outline:3px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.sw .tr,.sw .tr::after{transition:none}}
summary{cursor:pointer;padding:2px 0}
input[type=file]{padding:10px}
input.invalid{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
input[type=date],input[type=month]{color-scheme:dark}
input[type=date]::-webkit-calendar-picker-indicator,input[type=month]::-webkit-calendar-picker-indicator{cursor:pointer;opacity:1;padding:4px}
.qrbox{text-align:center;margin:12px 0}
.qrbox img{display:block;margin:8px auto;max-width:100%;max-height:50vh;background:#fff;padding:10px;border-radius:10px;cursor:zoom-in}
.zoom{position:fixed;inset:0;background:#fff;color:#000;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:zoom-out}
.zoom img{max-width:96vw;max-height:88vh}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(16px);max-width:92vw;padding:14px 22px;border-radius:10px;font-weight:700;background:var(--teal);color:#06201a;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:9;box-shadow:0 6px 20px #0008}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast.bad{background:var(--bad);color:#2a0803}
#toast.busy{background:var(--card);color:var(--ink);border:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
@media print{#toast{display:none}body{background:#fff;color:#000}header,nav,.noprint,button,.btn{display:none!important}.card{background:#fff;border:0;color:#000;padding:4px 0}input,textarea{background:#fff;color:#000;border:0;padding:0}.mute{color:#444}.big{color:#000}th,td{border-color:#999}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="cropper"></div>
<script>
// PASTE YOUR FIREBASE WEB CONFIG HERE (Project settings > Your apps > Web)
const CFG = 
{
  apiKey: "AIzaSyAVwHXRUZkkSaYBSqjgUoQNIZHINdU-m3U",
  authDomain: "ppkismktbakery.firebaseapp.com",
  projectId: "ppkismktbakery",
  storageBucket: "ppkismktbakery.firebasestorage.app",
  messagingSenderId: "571186338171",
  appId: "1:571186338171:web:b345306a0397e11d6685de",
  measurementId: "G-V75M1CW1KM"
};
firebase.initializeApp(CFG);
const auth = firebase.auth(), db = firebase.firestore(), $ = id => document.getElementById(id);
db.settings({ experimentalAutoDetectLongPolling:true, merge:true });
const TS = () => firebase.firestore.FieldValue.serverTimestamp();
const today = () => new Date().toLocaleDateString('en-CA');
const money = n => 'RM' + (+n || 0).toFixed(2);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const S = { mode:'t', user:null, classes:[], cls:null, clsName:'', date:today(), day:{breads:[]}, studs:[], stock:{}, sales:[], bal:0,
  tab:'bread', stab:'sell', me:null, pick:null, qty:1, pay:'cash', buyer:'', msg:'', err:'', draft:{}, mon:today().slice(0, 7), yr:today().slice(0, 4), sum:null, dirty:false, loading:true, qr:'', qrOpen:false, zoom:false, loadedCls:null, slow:false, stick:false, buyerErr:false };
const cref = () => db.doc('classes/' + S.cls);
const dref = () => db.doc(`classes/${S.cls}/days/${S.date}`);
const hashCls = () => (location.hash.match(/c=(\w+)/) || [])[1];
const price = id => ((S.day.breads || []).find(b => b.id === id) || {}).price || 0;
const salesTotal = () => Object.values(S.stock).reduce((a, e) => a + (e.sold || 0) * price(e.breadId), 0);
const closing = () => S.bal + salesTotal() - (+S.day.spending || 0) - (+S.day.salary || 0);
const left = (sid, bid) => { const e = S.stock[sid + '_' + bid]; return e ? e.made - (e.sold || 0) : 0; };

const hc0 = hashCls();
if (hc0) { S.mode = 's'; S.cls = hc0; }
auth.onAuthStateChanged(async u => {
  S.user = u; unflash();
  if (hc0) { render(); return; }   // the student page never waits for sign-in
  try {
    if (u && !u.isAnonymous) { S.mode = 't'; await loadClasses(); }
    else { S.cls = null; S.classes = []; }
  } catch (e) { S.err = e.message; }
  S.loading = false; render();
});
if (hc0) (async () => { await loadDay(); S.loading = false; render(); })();
setTimeout(() => { if (S.loading) { S.slow = true; render(); } }, 8000);
addEventListener('beforeunload', e => { if (S.dirty) { e.preventDefault(); e.returnValue = ''; } });

async function login() {
  flash('Signing in…', 'busy', 0);
  try { await auth.signInWithEmailAndPassword($('em').value, $('pw').value); }
  catch (e) { S.err = 'Cannot sign in. Check email and password.'; flash(S.err, 'bad', 5000); render(); }
}
async function loadClasses() {
  const q = await db.collection('classes').where('teacherUid', '==', S.user.uid).get();
  S.classes = q.docs.map(d => ({ id:d.id, ...d.data() }));
  if (!S.cls && S.classes.length) S.cls = S.classes[0].id;
  await loadDay();
}
async function loadDay() {
  if (!S.cls) return;
  const d = dref();
  try {
    const lc = S.loadedCls === S.cls;
    const [cs, st, ds, ss, sl] = await Promise.all([lc ? null : cref().get(), cref().collection('students').get(), d.get(),
      d.collection('stock').get(),
      S.mode === 's' ? (S.me ? d.collection('sales').where('studentId', '==', S.me.id).get() : null) : d.collection('sales').orderBy('ts', 'desc').get()]);
    if (cs) { S.clsName = cs.exists ? cs.data().name : ''; S.qr = cs.exists ? cs.data().qr || '' : ''; S.stick = cs.exists ? !!cs.data().stick : false; S.loadedCls = S.cls; }
    S.studs = st.docs.map(x => ({ id:x.id, ...x.data() })).sort((a, b) => a.name.localeCompare(b.name));
    S.day = ds.exists ? ds.data() : { breads:[], spending:0, salary:0, locked:false };
    S.day.breads = S.day.breads || []; S.dirty = false;
    S.stock = {}; ss.docs.forEach(x => S.stock[x.id] = x.data());
    S.sales = sl ? sl.docs.map(x => ({ id:x.id, ...x.data() })).sort((p, q) => tsv(q) - tsv(p)) : [];
    if (S.mode === 't') await loadBal();
    if (!S.day.breads.find(b => b.id === S.pick)) S.pick = (S.day.breads[0] || {}).id;
  } catch (e) { S.err = e.message; }
}
async function loadBal() {
  const pv = await db.collection(`classes/${S.cls}/days`).where('date', '<', S.date).orderBy('date', 'desc').limit(1).get();
  if (pv.empty) { S.bal = 0; return; }
  const p = pv.docs[0], pd = p.data(), ps = await p.ref.collection('stock').get();
  const pr = {}; (pd.breads || []).forEach(b => pr[b.id] = b.price);
  const sales = ps.docs.reduce((a, x) => a + (x.data().sold || 0) * (pr[x.data().breadId] || 0), 0);
  S.bal = (pd.balance || 0) + sales - (pd.spending || 0) - (pd.salary || 0);
}
async function persist() {
  await dref().set({ ...S.day, date:S.date, balance:S.bal, sales:salesTotal(), closing:closing() }, { merge:true });
}
let toastT, busyT;
function flash(msg, kind = 'ok', ms = 3200) {
  const e = $('toast'); if (!e) return;
  clearTimeout(toastT); e.textContent = msg; e.className = 'show ' + kind;
  if (ms) toastT = setTimeout(() => { e.className = ''; }, ms);
}
const unflash = () => { const e = $('toast'); if (e && e.className.includes('busy')) e.className = ''; };
const dirty = () => { S.dirty = true; const e = $('dirty'); if (e) e.hidden = false; };
const guard = () => !S.dirty || confirm('You have unsaved changes. Discard them?');
const copyLink = async l => {
  try { await navigator.clipboard.writeText(l); flash('Link copied'); }
  catch (e) { flash('Could not copy. Select the link and copy it by hand.', 'bad', 5000); }
};
// f may return false to say nothing happened (cancelled), so no success message is shown.
const go = async (f, ok) => {
  clearTimeout(busyT); busyT = setTimeout(() => flash('Working…', 'busy', 0), 400);
  let r;
  try { S.err = ''; r = await f(); } catch (e) { S.err = e.message; }
  clearTimeout(busyT); unflash();
  if (S.err) flash(S.err, 'bad', 5000); else if (ok && r !== false) flash(typeof ok === 'function' ? ok() : ok);
  render();
};

/* ---------- teacher actions ---------- */
const addClass = () => go(async () => {
  if (!guard()) return false;
  const name = prompt('Class name?'); if (!name) return false;
  const r = await db.collection('classes').add({ name, teacherUid:S.user.uid });
  S.cls = r.id; S.draft = {}; S.sum = null; await loadClasses();
}, 'Class added');
const addStudent = () => go(async () => {
  if (!guard()) return false;
  const name = prompt('Student name?'); if (!name) return false;
  await cref().collection('students').add({ name: name.trim() }); await loadDay();
}, 'Student added');
const pickClass = id => { if (!guard()) return render(); go(async () => { S.dirty = false; S.cls = id; S.draft = {}; S.sum = null; await loadDay(); }); };
const setDate = d => { if (!guard()) return render(); go(async () => { S.dirty = false; S.date = d || today(); S.draft = {}; await loadDay(); }); };
const tab = t => { S.tab = t; render(); };
const addBread = () => { S.day.breads.push({ id:'b' + Date.now().toString(36), name:'', price:0 }); S.dirty = true; render(); };
const delBread = i => { S.day.breads.splice(i, 1); S.dirty = true; render(); };
const saveBread = () => go(async () => {
  S.day.breads = S.day.breads.filter(b => b.name.trim());
  const batch = db.batch();
  for (const s of S.studs) for (const b of S.day.breads) {
    const k = s.id + '_' + b.id, old = S.stock[k] || { sold:0, made:0 };
    const made = Math.max(0, parseInt(k in S.draft ? S.draft[k] : old.made) || 0);
    if (made < (old.sold || 0)) throw Error(s.name + ' already sold ' + old.sold + ' ' + b.name);
    batch.set(dref().collection('stock').doc(k), { studentId:s.id, breadId:b.id, made, sold:old.sold || 0 });
  }
  await batch.commit(); S.draft = {}; await persist(); await loadDay();
}, 'Bread and quantities saved');
const saveCosts = () => go(async () => {
  S.day.spending = +$('sp').value || 0; S.day.salary = +$('sa').value || 0;
  S.day.title = $('ti').value.trim(); S.day.remarks = $('rm').value.trim(); await persist(); S.dirty = false;
}, 'Report saved');
const toggleLock = () => go(async () => { S.day.locked = !S.day.locked; await persist(); }, () => S.day.locked ? 'Day locked. No more changes.' : 'Day unlocked');
const delSale = id => go(async () => {
  const s = S.sales.find(x => x.id === id);
  if (S.day.locked || !confirm('Remove this sale?')) return false;
  await db.runTransaction(async t => {
    const r = dref().collection('stock').doc(s.studentId + '_' + s.breadId), d = await t.get(r);
    t.update(r, { sold: Math.max(0, (d.data().sold || 0) - s.qty) });
    t.delete(dref().collection('sales').doc(id));
  });
  await loadDay(); await persist();
}, 'Sale removed');

/* ---------- monthly / yearly ---------- */
const fmt = d => d.split('-').reverse().join('/');
const MN = m => new Date(2000, m - 1, 1).toLocaleString('en', { month:'long' });
const loadSummary = kind => go(async () => {
  const v = kind === 'm' ? S.mon : S.yr;
  if (!v) throw Error('Choose a ' + (kind === 'm' ? 'month' : 'year') + ' first.');
  const from = kind === 'm' ? v + '-01' : v + '-01-01', to = kind === 'm' ? v + '-31' : v + '-12-31';
  const ds = await db.collection(`classes/${S.cls}/days`).where('date', '>=', from).where('date', '<=', to).orderBy('date').get();
  const P = {}, pp = id => P[id] || (P[id] = { name:(S.studs.find(s => s.id === id) || {}).name || '?', made:0, sold:0, money:0 });
  const rows = await Promise.all(ds.docs.map(async d => {
    const x = d.data(), [sl, st] = await Promise.all([d.ref.collection('sales').get(), d.ref.collection('stock').get()]);
    const r = { date:x.date, qty:0, cash:0, qr:0, spending:x.spending || 0, salary:x.salary || 0, balance:x.balance || 0, remarks:x.remarks || '' };
    sl.docs.forEach(s => { const e = s.data(), p = pp(e.studentId); r.qty += e.qty; r[e.pay === 'qr' ? 'qr' : 'cash'] += e.amount; p.sold += e.qty; p.money += e.amount; });
    st.docs.forEach(s => { pp(s.data().studentId).made += s.data().made || 0; });
    r.sales = r.cash + r.qr;
    r.det = { day:x, bal:x.balance || 0, sales:sl.docs.map(s => ({ id:s.id, ...s.data() })), stock:st.docs.map(s => s.data()) };
    return r;
  }));
  S.sum = { kind, rows, P };
}, () => S.sum.rows.length ? 'Report ready' : 'No sales found for this period');
function sumView(kind) {
  const m = kind === 'm', v = S.sum && S.sum.kind === kind ? S.sum : null;
  let h = `<div class="card noprint row" style="align-items:end"><div style="flex:1"><label>${m ? 'Month' : 'Year'}</label>` +
    (m ? `<input type="month" value="${S.mon}" onchange="S.mon=this.value">` : `<input type="number" min="2020" max="2100" value="${S.yr}" onchange="S.yr=this.value">`) +
    `</div><button onclick="loadSummary('${kind}')">Show report</button></div>`;
  if (!v) return h + '<p class="mute">Pick a period and press Show report.</p>';
  if (!v.rows.length) return h + '<div class="card">No sales recorded in this period.</div>';
  const G = {};
  v.rows.forEach(r => {
    const k = m ? r.date : r.date.slice(0, 7), g = G[k] || (G[k] = { k, days:0, qty:0, sales:0, cash:0, qr:0, spending:0, salary:0, remarks:[] });
    g.days++; ['qty', 'sales', 'cash', 'qr', 'spending', 'salary'].forEach(f => g[f] += r[f]); if (r.remarks) g.remarks.push(r.remarks);
  });
  const gs = Object.values(G), T = f => gs.reduce((a, g) => a + g[f], 0), open = v.rows[0].balance, end = open + T('sales') - T('spending') - T('salary');
  const title = m ? MN(+S.mon.slice(5)) + ' ' + S.mon.slice(0, 4) : S.yr, R = (a, b) => `<tr><td>${a}</td><td class="r">${b}</td></tr>`;
  return h + `<div class="card scroll"><h2>${m ? 'Monthly' : 'Yearly'} report: ${esc(S.clsName)}, ${title}</h2><table>` +
    R('Balance at start', money(open)) + R(`Total sales (${T('qty')} sold over ${v.rows.length} sale days)`, money(T('sales'))) +
    R('Cash received', money(T('cash'))) + R('QR received', money(T('qr'))) + R('Total spending', money(T('spending'))) +
    R('Total salary paid', money(T('salary'))) + `<tr><td><b>Balance at end</b></td><td class="r big">${money(end)}</td></tr></table></div>
  <div class="card scroll"><table><tr><th>${m ? 'Date' : 'Month'}</th>${m ? '' : '<th class="r">Days</th>'}<th class="r">Sold</th><th class="r">Sales</th><th class="r">Cash</th><th class="r">QR</th><th class="r">Spending</th><th class="r">Salary</th>${m ? '<th>Remarks</th>' : ''}</tr>` +
    gs.map(g => `<tr><td>${m ? fmt(g.k) : MN(+g.k.slice(5))}</td>${m ? '' : `<td class="r">${g.days}</td>`}<td class="r">${g.qty}</td><td class="r">${money(g.sales)}</td><td class="r">${money(g.cash)}</td><td class="r">${money(g.qr)}</td><td class="r">${money(g.spending)}</td><td class="r">${money(g.salary)}</td>${m ? `<td>${esc(g.remarks.join(' '))}</td>` : ''}</tr>`).join('') +
    `<tr><td><b>Total</b></td>${m ? '' : `<td class="r">${v.rows.length}</td>`}<td class="r">${T('qty')}</td><td class="r">${money(T('sales'))}</td><td class="r">${money(T('cash'))}</td><td class="r">${money(T('qr'))}</td><td class="r">${money(T('spending'))}</td><td class="r">${money(T('salary'))}</td>${m ? '<td></td>' : ''}</tr></table></div>

const clamp = (v, a, b) => Math.min(Math.max(v, a), b);

function cropMove(o, c, dx, dy, dw, dh) {
  if (c === 'move') return { x:clamp(o.x + dx, 0, dw - o.s), y:clamp(o.y + dy, 0, dh - o.s), s:o.s };
  const d = c === 'se' ? (dx + dy) / 2 : c === 'nw' ? -(dx + dy) / 2 : c === 'ne' ? (dx - dy) / 2 : (dy - dx) / 2;
  const mx = c === 'se' ? Math.min(dw - o.x, dh - o.y) : c === 'nw' ? Math.min(o.x + o.s, o.y + o.s) : c === 'ne' ? Math.min(dw - o.x, o.y + o.s) : Math.min(o.x + o.s, dh - o.y);

  return { x:c === 'se' || c === 'ne' ? o.x : o.x + o.s - s, y:c === 'se' || c === 'sw' ? o.y : o.y + o.s - s, s };
}
function encodeCrop(img, sx, sy, sw) {   // keep the saved image small but still scannable

}
function startCrop(img, url, done) {

  host.innerHTML = `<div class="cw" role="dialog" aria-modal="true" aria-label="Crop the QR code"><b>Crop the QR code</b>
    <p class="mute">Drag the square over the QR code. Drag a corner to resize it.</p>
    <div class="stage" style="width:${dw}px;height:${dh}px"><img alt="Picture to crop" src="${url}">
    <div id="cbox" tabindex="0" aria-label="Crop area. Arrow keys move it. Plus and minus resize it."><i class="nw" data-c="nw"></i><i class="ne" data-c="ne"></i><i class="sw" data-c="sw"></i><i class="se" data-c="se"></i></div></div>
    <div class="row" style="justify-content:center"><button id="ccancel">Cancel</button><button class="go" style="width:auto" id="csave">Use this crop</button></div></div>`;
  host.className = 'on';
  const box = $('cbox'), close = () => { host.className = ''; host.innerHTML = ''; URL.revokeObjectURL(url); };
  const paint = () => { box.style.left = B.x + 'px'; box.style.top = B.y + 'px'; box.style.width = box.style.height = B.s + 'px'; };
  [box, ...box.querySelectorAll('i')].forEach(el => {

    if (!S.stick) { S.me = null; S.stab = 'sell'; S.pay = 'cash'; }   // back to "Who are you?" for the next student
    flash(`Sale recorded: ${q} × ${b.name}, ${money(q * b.price)}`);
  } catch (e) { S.msg = e.message; flash(e.message, 'bad', 5000); await loadDay(); }   // resync if the sale was refused
});

/* ---------- views ---------- */
const head = right => `<header><b>PPKI SMK Tansau</b>${right || ''}</header>`;
function render() {
  const A = $('app');
  if (S.loading) {
    A.innerHTML = head() + `<main><p class="mute">Loading…</p>${S.slow ? '<div class="card"><p>This is taking longer than usual. Check your internet connection. If you opened the link inside another app (such as WhatsApp), open it in Safari instead.</p><button class="go" onclick="location.reload()">Try again</button></div>' : ''}</main>`;
    return;
  }
  if (S.mode === 's') {
    A.innerHTML = studentView() + (S.zoom && S.qr ? `<div class="zoom" onclick="S.zoom=false;render()"><img src="${S.qr}" alt="Payment QR code"><p>Tap anywhere to close</p></div>` : '');
    return;
  }
  if (!S.user || S.user.isAnonymous) {
    A.innerHTML = head() + `<main><div class="card"><h2>Teacher sign in</h2><label>Email</label><input id="em" type="email">
    <label>Password</label><input id="pw" type="password"><p><button class="go" onclick="login()">Sign in</button></p>
    <p class="bad">${esc(S.err)}</p></div></main>`; return;
  }
  A.innerHTML = teacherView();
}
function studentView() {
  const h = head(`<span class="mute">${esc(S.clsName)} · ${S.date}</span>` + (S.user && !S.user.isAnonymous ? `<a class="btn" href="${esc(location.pathname)}">Teacher view</a>` : ''));
  if (S.err) return h + `<main><div class="card"><p class="bad">${esc(S.err)}</p><button class="go" onclick="location.reload()">Try again</button></div></main>`;
  if (!S.day.breads.length) return h + `<main><div class="card">Your teacher has not added bread for today yet.</div></main>`;
  if (!S.me) return h + `<main><div class="card"><h2>Who are you?</h2><div class="tiles names">` +
    S.studs.map(s => `<button class="tile who" onclick="me('${s.id}')">${esc(s.name)}</button>`).join('') + `</div></div></main>`;
  const L = S.day.locked;
  const nav = `<nav><button class="${S.stab === 'sell' ? 'on' : ''}" onclick="S.stab='sell';render()">Sell</button>
  <button class="${S.stab === 'mine' ? 'on' : ''}" onclick="S.stab='mine';render()">My sales</button>
  <button onclick="notMe()">Not ${esc(S.me.name.split(' ')[0])}?</button></nav>`;
  if (S.stab === 'mine') {
    const mine = S.sales.filter(x => x.studentId === S.me.id), sum = p => mine.filter(x => !p || x.pay === p).reduce((a, x) => a + x.amount, 0);
    return h + nav + `<main><div class="card"><h2>${esc(S.me.name)}</h2><p>Cash ${money(sum('cash'))} · QR ${money(sum('qr'))}</p>
    <div class="big">Total ${money(sum())}</div></div><div class="card scroll"><table>` +
      (mine.map(x => `<tr><td>${x.qty} × ${esc(x.bread)}</td><td>${esc(x.buyer)}</td><td>${x.pay === 'qr' ? 'QR' : 'Cash'}</td><td class="r">${money(x.amount)}</td></tr>`).join('') || '<tr><td class="mute">No sales yet.</td></tr>') + '</table></div>';
  }
  const b = S.day.breads.find(x => x.id === S.pick), lf = b ? left(S.me.id, b.id) : 0, q = Math.min(S.qty, Math.max(1, lf));
  return h + nav + `<main><div class="tiles">` + S.day.breads.map(x => `<button class="tile ${x.id === S.pick ? 'on' : ''}" onclick="pickBread('${x.id}')">
    <b>${esc(x.name)}</b><small>${money(x.price)} each</small><em>${left(S.me.id, x.id)}</em><small>left</small></button>`).join('') + `</div>
  <div class="card"><label for="buyer">Buyer's name</label><input id="buyer" class="${S.buyerErr ? 'invalid' : ''}" maxlength="60" value="${esc(S.buyer)}" placeholder="e.g. Cikgu Aminah" aria-describedby="berr" ${S.buyerErr ? 'aria-invalid="true"' : ''}
  oninput="S.buyer=this.value;S.buyerErr=false;this.classList.remove('invalid');this.removeAttribute('aria-invalid');$('berr').hidden=true">
  <p id="berr" class="bad" ${S.buyerErr ? '' : 'hidden'}>Please enter the buyer's name.</p>
  <label>How many?</label><div class="qty"><button onclick="step(-1)" aria-label="Less">−</button><b>${q}</b><button onclick="step(1)" aria-label="More">+</button></div>
  <label>Payment</label><div class="pay"><button class="${S.pay === 'cash' ? 'on' : ''}" onclick="setPay('cash')">Cash</button>
  <button class="${S.pay === 'qr' ? 'on' : ''}" onclick="setPay('qr')">QR</button></div>${S.pay === 'qr' ? qrBox() : ''}
  <div class="sum"><div class="mute">${q} × ${b ? esc(b.name) : ''} @ ${money(b && b.price)}</div><b>Total ${money(q * (b ? b.price : 0))}</b></div>
  <button class="go" onclick="record()" ${L || lf < 1 ? 'disabled' : ''}>${L ? 'Day is closed' : lf < 1 ? 'Sold out' : 'Record sale'}</button>
  <p class="${S.msg === 'Sale recorded.' ? 'ok' : 'bad'}">${esc(S.msg)}</p></div></main>`;
}
function teacherView() {
  const L = S.day.locked, dis = L ? 'disabled' : '';
  const link = location.origin + location.pathname + '#c=' + S.cls;
  let h = head(`<input type="date" style="width:auto" value="${S.date}" onchange="setDate(this.value)"><button onclick="auth.signOut()">Sign out</button>`);
  h += `<main><div class="row noprint"><select style="flex:1" onchange="pickClass(this.value)">${S.classes.map(k => `<option value="${k.id}" ${k.id === S.cls ? 'selected' : ''}>${esc(k.name)}</option>`).join('')}</select>
  <button onclick="addClass()">Add class</button><button onclick="addStudent()" ${S.cls ? '' : 'disabled'}>Add student</button></div>`;
  if (!S.cls) return h + '<div class="card">Add your first class to begin.</div></main>';
  h += `<div class="card noprint"><label>Student link (no sign in needed)</label><div class="row"><input style="flex:1;min-width:200px" readonly value="${esc(link)}" onclick="this.select()">
  <button onclick="copyLink('${link}')">Copy</button><a class="btn" href="${esc(link)}" target="_blank" rel="noopener">Open student page</a></div>
  <label class="sw"><input type="checkbox" role="switch" ${S.stick ? 'checked' : ''} onchange="setStick(this.checked)"><span class="tr"></span>
  <span><b>Stay on the same student</b><br><span class="mute">${S.stick ? 'On: the page stays on the student after each sale.' : 'Off: the page returns to "Who are you?" after each sale.'}</span></span></label></div>
  <details class="card noprint" ${S.qrOpen ? 'open' : ''} ontoggle="S.qrOpen=this.open"><summary><b>Payment QR code for ${esc(S.clsName)}</b> <span class="${S.qr ? 'ok' : 'mute'}">${S.qr ? 'Set' : 'Not set'}</span></summary>
  <p class="mute">Students show this to buyers who pay by QR. Each class has its own. After choosing a picture you can crop it to just the QR code.</p>
  ${S.qr ? `<img src="${S.qr}" alt="QR code preview" style="max-width:220px;background:#fff;padding:8px;border-radius:8px;display:block">` : ''}
  <label>${S.qr ? 'Replace QR code' : 'Upload QR code image'}</label><input type="file" accept="image/*" onchange="uploadQr(this)">
  ${S.qr ? '<p><button onclick="removeQr()">Remove QR code</button></p>' : ''}</details>
  <p class="${L ? 'ok' : ''}">${L ? 'This day is locked.' : ''}<span class="bad"> ${esc(S.err)}</span></p>
  <nav class="noprint">${[['bread', 'Add bread'], ['sales', 'Sales today'], ['rep', 'Report'], ['mon', 'Monthly'], ['yr', 'Yearly']].map(t => `<button class="${S.tab === t[0] ? 'on' : ''}" onclick="tab('${t[0]}')">${t[1]}</button>`).join('')}</nav>`;
  const bs = S.day.breads;
  if (S.tab === 'bread') {
    h += `<div class="card"><h2>Bread for ${fmt(S.date)}</h2>` + bs.map((b, i) => `<div class="row" style="margin-bottom:8px">
      <input style="flex:1" placeholder="Bread name" value="${esc(b.name)}" onchange="S.day.breads[${i}].name=this.value;dirty()" ${dis}>
      <input type="number" step="0.01" min="0" placeholder="RM" value="${b.price || ''}" onchange="S.day.breads[${i}].price=+this.value||0;dirty()" ${dis}>
      <button onclick="delBread(${i})" ${dis}>Remove</button></div>`).join('') +
      `<button onclick="addBread()" ${dis}>Add bread type</button></div>` +
      (bs.length ? `<div class="card scroll"><h2>Buns made per student</h2><table><tr><th>Student</th>${bs.map(b => `<th>${esc(b.name || 'Bread')}</th>`).join('')}</tr>` +
        S.studs.map(s => `<tr><td>${esc(s.name)}</td>` + bs.map(b => { const k = s.id + '_' + b.id;
          return `<td><input type="number" min="0" value="${k in S.draft ? S.draft[k] : (S.stock[k] || {}).made || 0}" onchange="S.draft['${k}']=this.value;dirty()" ${dis}></td>`; }).join('') + '</tr>').join('') +
        `</table></div>` : `<p class="mute">Add a bread type above, then you can enter how many each student made.</p>`) +
      (bs.length || S.dirty ? `<p id="dirty" class="bad" ${S.dirty ? '' : 'hidden'}>You have unsaved changes. Press Save below.</p>
      <button class="go" onclick="saveBread()" ${dis}>${bs.length ? 'Save bread and quantities' : 'Save changes'}</button>` : '');
  } else if (S.tab === 'sales') {
    const t = p => S.sales.filter(x => x.pay === p).reduce((a, x) => a + x.amount, 0);
    h += `<div class="card scroll"><table><tr><th>Student</th><th class="r">Made</th><th class="r">Sold</th><th class="r">Left</th><th class="r">Money</th></tr>` +
      S.studs.map(s => { const es = Object.values(S.stock).filter(e => e.studentId === s.id), m = es.reduce((a, e) => a + e.made, 0), so = es.reduce((a, e) => a + (e.sold || 0), 0);
        return `<tr><td>${esc(s.name)}</td><td class="r">${m}</td><td class="r">${so}</td><td class="r">${m - so}</td><td class="r">${money(es.reduce((a, e) => a + (e.sold || 0) * price(e.breadId), 0))}</td></tr>`; }).join('') +
      `</table><p>Cash ${money(t('cash'))} · QR ${money(t('qr'))}</p></div><div class="card scroll"><table>` +
      (S.sales.map(x => `<tr><td>${esc(x.studentName)}</td><td>${x.qty} × ${esc(x.bread)}</td><td>${esc(x.buyer)}</td><td>${x.pay === 'qr' ? 'QR' : 'Cash'}</td><td class="r">${money(x.amount)}</td>
      <td><button onclick="delSale('${x.id}')" ${dis}>Remove</button></td></tr>`).join('') || '<tr><td class="mute">No sales yet.</td></tr>') + '</table></div>';
  } else if (S.tab === 'rep') {
    h += reportView(dis, L);
  } else {
    h += sumView(S.tab === 'mon' ? 'm' : 'y');
  }
  return h + '</main>';
}
render();
</script>
</body>
</html>
